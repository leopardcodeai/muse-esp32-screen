# automation.muse_image_webhook: POST a picture to Home Assistant and let the box
# show it, with the same picture announced to the web twin and the camera layout.
# This file is one automation body (for automation: !include_dir_list automations/).
#
# Payload (JSON, POST only):
#   {
#     "image":  "<base64 PNG/JPEG or data:image/...;base64,...>",   required
#     "title":  "Doorbell",                                        optional
#     "message": "Front door, 18:31",                              optional
#     "name":   "doorbell",                                        optional file slug
#     "target": "box" | "square" | "square_hq" | "wide",           optional, box
#     "mode":   "contain" | "cover"                                optional, contain
#   }
#
# Security:
#   * The webhook id is a secret (secrets.yaml: muse_image_webhook_id: <random>).
#     Treat it like a password; Home Assistant answers 200 even for an unknown id.
#   * local_only: true: requests through Home Assistant Cloud or the internet are
#     refused (Home Assistant still answers 200). allowed_methods: [POST] refuses
#     a GET/PUT with 405.
#   * mode: queued, max: 5: five uploads may wait; the sixth is dropped with a
#     warning instead of spawning unbounded shell processes.
#   * trace: stored_traces: 0: the payload contains a picture and is not kept in
#     a trace.
#   * The image is capped at 100000 base64 characters here and in muse_image.py;
#     the Python side checks the PNG/JPEG magic, the decoded format and at most
#     25 megapixels, strips data URIs and turns the client name into a slug.
#   * The allowed characters check below is also an argument-injection guard:
#     shell_command uses shlex.split, so a quote in the payload must never reach
#     the command line. title and message never enter a shell; name is slugified
#     before it is passed, and target/mode are checked against fixed lists.
#
# Call (replace the address and use your own webhook id):
#   curl -s -X POST "http://homeassistant.local:8123/api/webhook/$MUSE_IMAGE_WEBHOOK_ID" \
#     -H "Content-Type: application/json" \
#     -d '{"image":"data:image/jpeg;base64,...","title":"Doorbell","name":"doorbell"}'
#
# The live box's prefix is muse_esp32boxs3_screen. The public firmware name
# muse-esp32-s3-box-3-screen gives esphome.muse_esp32_s3_box_3_screen_muse_show_image_timed
# and ..._muse_show_text; replace both in a public installation.
alias: "Muse Screen: image webhook"
description: >-
  Accept a POSTed base64 PNG/JPEG, resize it for the Muse box and show it; the
  web twin and the Apple TV/camera layout get the same URL as a muse_web event.
mode: queued
max: 5
trace:
  stored_traces: 0
triggers:
  - trigger: webhook
    webhook_id: !secret muse_image_webhook_id
    allowed_methods:
      - POST
    local_only: true
conditions:
  - condition: template
    value_template: "{{ image | length > 0 }}"
  - condition: template
    value_template: "{{ image | length <= 100000 }}"
  # Base64 and the data-URI punctuation only; no whitespace, quotes or backslashes.
  - condition: template
    value_template: "{{ image | regex_match('^[A-Za-z0-9+/=,;:._-]+$') }}"
  - condition: template
    value_template: "{{ target in ['box', 'square', 'square_hq', 'wide'] }}"
  - condition: template
    value_template: "{{ mode in ['contain', 'cover'] }}"
variables:
  payload: "{{ trigger.json | default({}, true) }}"
  image: "{{ payload.image | default('', true) | string | trim }}"
  title: "{{ payload.title | default('Bild', true) | string | trim }}"
  message: "{{ payload.message | default('', true) | string }}"
  # A slug is the only thing the shell sees for the name; no path, no quote.
  image_name: >-
    {{ (payload.name | default(title, true) | string | slugify) | default('muse-image', true) }}
  target: "{{ payload.target | default('box', true) | string | trim | lower }}"
  mode: "{{ payload.mode | default('contain', true) | string | trim | lower }}"
actions:
  - action: shell_command.muse_image_ingest
    data:
      image_b64: "{{ image }}"
      name: "{{ image_name }}"
      target: "{{ target }}"
      mode: "{{ mode }}"
    response_variable: ingest
    continue_on_error: true
  - variables:
      # A missing action or a killed process leaves ingest undefined; the
      # fallback below still runs instead of aborting the automation.
      ingest_raw: >-
        {% if ingest is defined and ingest.stdout is defined %}
          {{ ingest.stdout | trim }}
        {% endif %}
      ingest_json: >-
        {{ ingest_raw if ingest_raw | trim else
           {'ok': false, 'error': 'no response from the image ingester'} | tojson }}
  - if:
      - condition: template
        value_template: "{{ (ingest_json | from_json)['ok'] | default(false) }}"
    then:
      # Event first: a missing esphome service is a configuration error that
      # continue_on_error cannot swallow; the web/camera mirror must still run.
      - action: event
        event_type: muse_web
        event_data:
          action: show_image_timed
          title: "{{ title }}"
          message: "{{ message }}"
          url: "{{ (ingest_json | from_json)['url'] | default('') }}"
          seconds: 60
      - action: esphome.muse_esp32boxs3_screen_muse_show_image_timed
        continue_on_error: true
        data:
          title: "{{ title }}"
          message: "{{ message }}"
          url: "{{ (ingest_json | from_json)['url'] | default('') }}"
          seconds: 60
    else:
      - action: event
        event_type: muse_web
        event_data:
          action: show_text
          title: "{{ title }}"
          message: "Bild nicht erreichbar"
      - action: esphome.muse_esp32boxs3_screen_muse_show_text
        continue_on_error: true
        data:
          title: "{{ title }}"
          message: "Bild nicht erreichbar"
